<!DOCTYPE html>
<html lang="fr">

<head>
<meta charset="UTF-8">
<title>Theta Compta</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<h1>Theta Compta</h1>

<div class="layout">

    <section class="panel">
        <h2>Sociétés</h2>

        <div class="form-row">
            <input id="companyName" type="text" placeholder="Nom de la société">
            <button id="newCompany">Ajouter</button>
        </div>

        <ul id="companyList"></ul>
    </section>

    <section class="panel">
        <h2 id="selectedCompanyTitle">Sélectionne une société</h2>

        <div id="bankSection" style="display:none;">
            <h3>Comptes bancaires</h3>

            <div class="form-grid">
                <input id="bankName" type="text" placeholder="Banque, ex : Crédit Agricole">
                <input id="accountName" type="text" placeholder="Nom du compte, ex : Compte courant">
                <input id="iban" type="text" placeholder="IBAN">
                <button id="newBankAccount">Ajouter le compte</button>
            </div>

            <ul id="bankAccountList"></ul>
        </div>
    </section>

    <section class="panel">
        <h2 id="selectedAccountTitle">Sélectionne un compte bancaire</h2>

        <div id="statementSection" style="display:none;">
            <h3>Relevés bancaires PDF</h3>

            <button id="importStatement">Importer un PDF</button>

            <ul id="statementList"></ul>

            <h3>Opérations extraites</h3>
<ul id="transactionList"></ul>
        </div>
    </section>

</div>

<script src="renderer.js"></script>

</body>

</html>
